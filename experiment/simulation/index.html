<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Predator–Prey Dynamics — Lotka–Volterra (Rats & Snakes) — Simulation</title>
<link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
<div class="card" id="simbox">
<div class="simbar"><span class="simbar-logo" aria-hidden="true"><img src="../assets/images/logo-amrita.svg" alt="Amrita Vishwa Vidyapeetham"></span><h1 class="simbar-title">Predator–Prey Dynamics — Lotka–Volterra (Rats &amp; Snakes)</h1><button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="Toggle full screen" aria-label="Toggle full screen">⛶</button></div>
<div class="sim">
<div class="controls">
<label style="font-weight:600;font-size:.9rem;display:block;margin-bottom:6px">Plot</label>
<select class="dropBox" id="plotMode" onchange="if(sim)drawChart()">
  <option value="phase">Rats vs Snakes (phase plane)</option>
  <option value="rats">Rats population vs time</option>
  <option value="snakes">Snakes population vs time</option>
  <option value="both">Rats &amp; Snakes vs time (dual axis)</option>
</select>
<div class="field"><label>Initial rats (prey) <span class="val" id="v_ratPop">4095</span></label><input type="range" id="ratPop" min="500" max="8000" step="5" value="4095" oninput="sync()"></div>
<div class="field"><label>Initial snakes (predator) <span class="val" id="v_snakePop">347</span></label><input type="range" id="snakePop" min="10" max="1000" step="1" value="347" oninput="sync()"></div>
<div class="field"><label>Number of steps <span class="val" id="v_steps">500</span></label><input type="range" id="steps" min="50" max="1500" step="10" value="500" oninput="sync()"></div>
<div class="field"><label>Step size (Δt) <span class="val" id="v_stepSize">1</span></label><input type="range" id="stepSize" min="0.5" max="20" step="0.5" value="1" oninput="sync()"><div class="hint">Small Δt keeps the orbit stable; large Δt makes RK4 drift.</div></div>
<div class="btnrow">
  <button class="btn btn-primary" onclick="run()">▶ Run</button>
  <button class="btn btn-ghost" onclick="play()" id="playBtn">Play ▶</button>
  <button class="btn btn-ghost" onclick="step()">Step ⏭</button>
  <button class="btn btn-ghost" onclick="resetSim()">↺ Reset</button>
</div>
<div class="dl-label">Download</div>
<div class="btnrow">
  <button class="btn btn-accent" onclick="downloadPNG('lotka-volterra.png')">⤓ PNG</button>
  <button class="btn btn-accent" onclick="downloadCSV()">⤓ CSV</button>
</div>
</div>
<div class="plotwrap">
<canvas class="field" id="field" width="720" height="260"></canvas>
<div class="counts" id="counts"></div>
<div class="plot-title" id="plotTitle">Rats vs Snakes (phase plane)</div>
<canvas class="chart" id="chart" width="720" height="400"></canvas>
<div class="legend" id="legend"></div>
<div class="readout">Cursor: X = <b id="rx">–</b>, Y = <b id="ry">–</b></div>


</div>
</div>
</div>
<div class="toast" id="toast"></div>
<script src="../assets/js/chart.js"></script>
<script src="../assets/js/common.js"></script>
<script src="script.js"></script>
</body>
</html>
